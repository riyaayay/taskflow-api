spring.application.name=taskflow-api

# --- Default (local/dev) profile: in-memory H2 so the API runs with zero setup ---
spring.datasource.url=jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

taskflow.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1mb3ItdGFza2Zsb3ctYXBpLWNoYW5nZS1pbi1wcm9kdWN0aW9u}
taskflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${PORT:8080}
